/* ---------- renderer ---------- */

/* ---------- studio environment (reflections) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.background = new THREE.Color(0x000000);
const emis = (c, s) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(s), side: THREE.DoubleSide });

strip(60, 900, emis(0xffffff, 9), -520, 120, 520);            // key strip, left-front
{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#b8b8c0'); g.addColorStop(0.62, '#3a3a42'); g.addColorStop(0.85, '#050505'); g.addColorStop(1, '#000000');

strip(60, 900, emis(0xffffff, 4), 560, 120, 420);           // fill strip, right-front
strip(1400, 60, emis(0xffffff, 5), 0, 620, 250);            // top edge strip
strip(900, 500, emis(PURPLE, 1.0), 0, 80, -700);              // purple rim panel behind
strip(1600, 30, emis(PURPLE, 0.25), 0, -260, 500);             // low purple kicker (floor bounce)

let envRT = null, envKey = '';
function updateEnv(sweepX, sweepI) {

  if (key === envKey) return; envKey = key;

/* ---------- wordmark ---------- */
const fontData = new TTFLoader().parse(await (await fetch('node_modules/@fontsource/unbounded/files/unbounded-latin-600-normal.woff')).arrayBuffer());

// vertical center of lockup

/* ---------- floor: black glass ---------- */

  vertexShader: `attribute float aSeed; uniform float uT, uS; varying float vA;
    void main(){ vec3 p = position; p.y += uT*6.0*(0.4+aSeed); p.x += sin(uT*0.4+aSeed*40.)*12.;

/* ---------- post ---------- */

  const v = o.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.45, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)'); o.fillStyle = v; o.fillRect(0, 0, W, H);
  o.globalCompositeOperation = 'overlay'; o.drawImage(grain[Math.floor(T * FPS) % 4], 0, 0, W, H); o.globalCompositeOperation = 'source-over';
  // lift: deepest black reads #080808
  o.globalCompositeOperation = 'lighten'; o.fillStyle = '#080808'; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
}

function renderFrame(T, sub = 1) {
  const span = 0.5 / FPS; // 180° shutter
  for (let i = 0; i < sub; i++) {
    const ts = sub > 1 ? T + (i / (sub - 1) - 0.5) * span : T;
    setState(Math.max(0, ts)); composer.render();
    o.globalAlpha = 1 / (i + 1); o.drawImage(glc, 0, 0);
  }
  o.globalAlpha = 1; setState(T);
  typeLayer(T); glint(T); finish(T);
  return out;
}
window.renderFrame = (T) => renderFrame(T, T < 3.3 ? 3 : 1);
await document.fonts.load(`400 34px Unbounded`); await document.fonts.load(`300 27px InterW`);
window.ready = true;
if (!P.has('render')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
</script>
