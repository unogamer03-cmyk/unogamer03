<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion Reel 2026</title>
<style>
  @font-face { font-family: "Grotesk"; src: url(fonts/grotesk-700.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: "Mono"; src: url(fonts/mono-500.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Kufi"; src: url(fonts/kufi-900.woff2) format("woff2"); font-weight: 900; }
  @font-face { font-family: "Kufi"; src: url(fonts/kufi-500.woff2) format("woff2"); font-weight: 500; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   MOTION REEL '26 — 15s, 120 BPM (1 beat = 0.5s). Every frame = f(t).
   ========================================================================= */
const W = 1920, H = 1080, DUR = 15, FPS = 30;
const C = { ink: '#0B0B10', bone: '#F1EDE4', red: '#FF4422', blue: '#2F4BFF', lime: '#D7FF3C', deep: '#070A24' };
const RENDER = new URLSearchParams(location.search).has('render');

/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuart: x => 1 - Math.pow(1 - x, 4),
};
// damped spring, dt in seconds since trigger -> 0..1 with overshoot
const spring = (dt, freq = 3.2, damp = 7) => dt <= 0 ? 0 : 1 - Math.exp(-damp * dt) * Math.cos(TAU * freq * dt);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- canvases ---------- */
const out = document.getElementById('out');
const octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');

/* impacts drive camera shake + chromatic aberration (also mirrored in audio) */
const HITS = [[0.5, .5], [1.0, .7], [2.0, 1], [3.0, 1], [4.0, .6], [6.0, 1.2], [8.0, .8], [10.0, .9], [11.5, .8], [12.0, .5], [12.5, .5], [13.0, 1], [13.5, .6]];
function hitEnergy(t, decay = 9) { let e = 0; for (const [h, a] of HITS) if (t >= h) e += a * Math.exp(-(t - h) * decay); return e; }

/* =========================================================================
   SCENE 01 — SQUASH & STRETCH (0 – 2s)
   ========================================================================= */
function dotState(t) {
  const yF = 610, r = 30;
  let y, sx = 1, sy = 1;
  if (t < 0.5) { const u = t / 0.5; y = lerp(-80, yF, u * u); const v = u; sy = 1 + 0.35 * v; sx = 1 - 0.18 * v; }
  else if (t < 1.0) { const u = (t - 0.5) / 0.5; y = yF - 300 * 4 * u * (1 - u); const v = Math.abs(1 - 2 * u); sy = 1 + 0.25 * v; sx = 1 - 0.12 * v; }
  else y = yF;
  for (const tc of [0.5, 1.0]) { const s = Math.exp(-Math.pow((t - tc) / 0.045, 2)); sx += 0.75 * s; sy -= 0.5 * s; }
  return { x: W / 2, y, r, sx, sy };
}
function scene1(t) {
  // reveal layer (scene 2 vermilion) under the split panels
  if (t > 1.45) scene2(t);
  const split = E.inOutExpo(prog(t, 1.5, 1.95));
  const off = split * 600;
  // top & bottom ink panels
  ctx.fillStyle = C.ink;
  ctx.fillRect(0, -off, W, H / 2 + 1);
  ctx.fillRect(0, H / 2 + off, W, H / 2);
  // subtle floor guide
  if (t < 1.0) {
    ctx.strokeStyle = 'rgba(241,237,228,.12)'; ctx.lineWidth = 2;
    const fw = E.outExpo(prog(t, 0.05, 0.6)) * 520;
    ctx.beginPath(); ctx.moveTo(W / 2 - fw, 640); ctx.lineTo(W / 2 + fw, 640); ctx.stroke();
    // shadow
    const d = dotState(t), k = clamp(1 - (640 - d.y) / 700);
    ctx.fillStyle = `rgba(0,0,0,${0.5 * k})`;
    ctx.beginPath(); ctx.ellipse(W / 2, 642, 46 * k + 6, 7 * k + 1, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = C.red;
  if (t < 1.0) {
    const d = dotState(t);
    ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.sx, d.sy);
    ctx.beginPath(); ctx.arc(0, -d.r, d.r, 0, TAU); ctx.fill(); ctx.restore();
  } else {
    // stretch into the horizon line
    const k = E.outExpo(prog(t, 1.0, 1.45));
    const anticip = Math.exp(-Math.pow((t - 1.02) / 0.04, 2));
    const w = lerp(60, W + 40, k) + 50 * anticip;
    const h = lerp(60, 6, E.outCubic(prog(t, 1.0, 1.3))) * (1 - 0.3 * anticip);
    const y = lerp(580, H / 2, E.inOutCubic(prog(t, 1.0, 1.4)));
    const fade = 1 - prog(t, 1.55, 1.8);
    ctx.globalAlpha = fade;
    ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* =========================================================================
   SCENE 02 — KINETIC TYPE: MOTION -> E+MOTION (2 – 4s)
   ========================================================================= */
let TYPE = null;
function layoutType() {
  ctx.font = '700 330px Grotesk';
  const word = 'EMOTION';
  const ws = [...word].map(ch => ctx.measureText(ch).width);
  const track = -6;
  const widthOf = from => ws.slice(from).reduce((a, b) => a + b + track, -track);
  const xsB = [], xsA = [];
  let x = W / 2 - widthOf(0) / 2; for (let i = 0; i < 7; i++) { xsB.push(x); x += ws[i] + track; }
  x = W / 2 - widthOf(1) / 2; xsA.push(0); for (let i = 1; i < 7; i++) { xsA.push(x); x += ws[i] + track; }
  const m = ctx.measureText('I');
  const iIdx = 4;
  TYPE = { word, ws, xsA, xsB, base: 660, cap: m.actualBoundingBoxAscent, iIdx };
}
function scene2(t) {
  ctx.fillStyle = C.red; ctx.fillRect(0, 0, W, H);
  if (!TYPE) layoutType();
  const { word, ws, xsA, xsB, base, cap, iIdx } = TYPE;
  // zoom-through the "I" stem
  const zk = E.inExpo(prog(t, 3.5, 4.0));
  const zoom = 1 + zk * 140;
  const ix = lerp(xsA[iIdx], xsB[iIdx], spring(t - 3.0, 2.2, 6.5)) + ws[iIdx] / 2;
  const iy = base - cap / 2;
  const punch = 1 + 0.05 * Math.exp(-Math.max(0, t - 2.5) * 10) * (t > 2.5 ? 1 : 0) + 0.04 * Math.exp(-Math.max(0, t - 3.0) * 8) * (t > 3 ? 1 : 0);
  ctx.save();
  ctx.translate(ix, iy); ctx.scale(zoom * punch, zoom * punch); ctx.rotate(zk * 0.35); ctx.translate(-ix, -iy);
  // backing label
  ctx.font = '500 22px Mono'; ctx.fillStyle = 'rgba(11,11,16,.55)'; ctx.textAlign = 'left';
  const lab = E.outExpo(prog(t, 2.15, 2.6));
  ctx.save(); ctx.beginPath(); ctx.rect(xsB[0], base - cap - 80, 900 * lab, 40); ctx.clip();
  ctx.fillText('FIG. 02 — TYPE THAT MOVES PEOPLE', xsB[0], base - cap - 48); ctx.restore();
  ctx.font = '700 330px Grotesk'; ctx.fillStyle = C.ink; ctx.textBaseline = 'alphabetic';
  const slide = spring(t - 3.0, 2.2, 6.5);
  for (let i = 1; i < 7; i++) {
    const t0 = 2.0 + (i - 1) * 0.055;
    const k = E.outExpo(prog(t, t0, t0 + 0.5));
    if (k <= 0) continue;
    const x = lerp(xsA[i], xsB[i], slide);
    ctx.save();
    ctx.beginPath(); ctx.rect(x - 40, base - cap - 60, ws[i] + 80, cap + 60 + 6); ctx.clip();
    const y = base + (1 - k) * (cap + 80);
    ctx.translate(x + ws[i] / 2, y); ctx.rotate((1 - k) * 0.25 * (i % 2 ? 1 : -1));
    ctx.fillText(word[i], -ws[i] / 2, 0);
    ctx.restore();
  }
  // the E drops in with a spring and shoves the word
  if (t > 2.75) {
    const d = spring(t - 2.78, 2.0, 6);
    const y = lerp(-200, base, clamp(d, 0, 1.2));
    const sq = Math.exp(-Math.pow((t - 2.97) / 0.05, 2));
    ctx.save(); ctx.translate(xsB[0] + ws[0] / 2, y);
    ctx.scale(1 + 0.18 * sq, 1 - 0.22 * sq);
    ctx.fillStyle = C.ink; ctx.fillText('E', -ws[0] / 2, 0); ctx.restore();
  }
  // underline that wipes under the E (emphasis)
  const ul = E.outExpo(prog(t, 3.05, 3.45));
  if (ul > 0) { ctx.fillStyle = C.bone; ctx.fillRect(xsB[0], base + 26, ws[0] * ul, 14); }
  ctx.restore();
}

/* =========================================================================
   SCENE 03 — STAGGER & MORPH GRID (4 – 6s)
   ========================================================================= */
const NP = 72;
function shapeR(kind, th) {
  if (kind === 0) return 1;                              // circle
  const n = kind === 1 ? 4 : kind === 2 ? 3 : 0;
  if (n) { const s = TAU / n; const a = ((th % s) + s) % s - s / 2; return Math.cos(Math.PI / n) / Math.cos(a) * (n === 3 ? 1.15 : 0.95); }
  // 4-point star
  const s = TAU / 8; const a = ((th % (s * 2)) + s * 2) % (s * 2); return a < s ? lerp(1.15, 0.42, a / s) : lerp(0.42, 1.15, (a - s) / s);
}
function scene3(t) {
  const lt = t - 4;
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const cols = 16, rows = 9, cell = 120, ox = (W - cols * cell) / 2 + cell / 2, oy = (H - rows * cell) / 2 + cell / 2;
  const conv = t - 5.5;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    let x = ox + i * cell, y = oy + j * cell;
    const dx = x - W / 2, dy = y - H / 2, dist = Math.hypot(dx, dy);
    const delay = dist / 1100 * 0.32;
    const appear = E.outBack(prog(lt, delay * 0.8, delay * 0.8 + 0.35));
    if (appear <= 0) continue;
    // morph stages on beats
    const stages = [4.0, 4.5, 5.0, 5.25];
    let from = 0, to = 0, mk = 0;
    for (let s = 1; s < stages.length; s++) {
      const k = E.inOutCubic(prog(t, stages[s] + delay, stages[s] + delay + 0.28));
      if (k > 0) { from = s - 1; to = s; mk = k; }
    }
    const rot = [4.5, 5.0, 5.25].reduce((a, s) => a + E.outBack(prog(t, s + delay, s + delay + 0.32)) * Math.PI / 2, 0) + Math.sin(lt * 3 - dist * 0.01) * 0.15;
    // wave scale
    const wave = 1 + 0.25 * Math.sin(lt * 7 - dist * 0.012);
    let size = 34 * appear * wave;
    // converge to center
    let ck = 0;
    if (conv > 0) {
      ck = E.inExpo(prog(conv, delay * 0.6, delay * 0.6 + 0.38));
      x = lerp(x, W / 2, ck); y = lerp(y, H / 2, ck); size *= (1 - ck * 0.75);
    }
    // color logic: diagonal wave of accent
    const band = Math.floor(lt * 4 + i * 0.25 + j * 0.25) % 6;
    ctx.fillStyle = band === 0 ? C.red : band === 3 ? C.blue : C.bone;
    if (ck > 0.6) ctx.fillStyle = C.red;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let p = 0; p < NP; p++) {
      const th = p / NP * TAU;
      const r = lerp(shapeR(from, th), shapeR(to, th), mk) * size;
      p ? ctx.lineTo(Math.cos(th) * r, Math.sin(th) * r) : ctx.moveTo(Math.cos(th) * r, Math.sin(th) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // core glow at convergence
  const g = E.inExpo(prog(t, 5.65, 6.0));
  if (g > 0) {
    const R = 20 + g * 90;
    const gr = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R * 3);
    gr.addColorStop(0, `rgba(255,240,220,${g})`); gr.addColorStop(0.3, `rgba(255,68,34,${0.8 * g})`); gr.addColorStop(1, 'rgba(255,68,34,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================================
   SCENE 04 — PARTICLE SYSTEM: burst -> curl flow -> "FLOW" -> disperse (6 – 8s)
   ========================================================================= */
let PARTS = null;
function buildParticles() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.font = '700 460px Grotesk'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('FLOW', W / 2, H / 2 + 20);
  const d = x.getImageData(0, 0, W, H).data, pts = [];
  for (let yy = 0; yy < H; yy += 5) for (let xx = 0; xx < W; xx += 5) if (d[(yy * W + xx) * 4 + 3] > 128) pts.push([xx, yy]);
  const R = rng(7), N = 5200;
  PARTS = [];
  for (let i = 0; i < N; i++) {
    const tg = pts[Math.floor(R() * pts.length)];
    PARTS.push({
      a: R() * TAU, s: 500 + Math.pow(R(), 0.6) * 1700, tx: tg[0] + (R() - .5) * 3, ty: tg[1] + (R() - .5) * 3,
      delay: R() * 0.3, col: R() < 0.62 ? C.bone : R() < 0.6 ? C.red : C.blue, sz: 1.6 + R() * 2.6, sp: (R() - .5) * 2, side: R() < .5 ? -1 : 1, dd: R() * 0.25,
    });
  }
}
function partPos(p, t) {
  const lt = Math.max(0, t - 6);
  const r = p.s * (1 - Math.exp(-2.6 * lt)) / 2.6;
  const ang = p.a + lt * (1.4 / (1 + r / 300)) + p.sp * lt * 0.3;
  let x = W / 2 + Math.cos(ang) * r, y = H / 2 + Math.sin(ang) * r * 0.75;
  // pseudo curl noise
  x += 60 * Math.sin(y * 0.006 + lt * 2.1) * lt; y += 60 * Math.cos(x * 0.005 - lt * 1.7) * lt;
  const f = E.outExpo(prog(t, 6.85 + p.delay, 7.45 + p.delay));
  x = lerp(x, p.tx, f); y = lerp(y, p.ty, f);
  // shimmer while forming
  x += Math.sin(t * 9 + p.a * 5) * 1.6 * f; y += Math.cos(t * 8 + p.s) * 1.6 * f;
  const dk = E.inExpo(prog(t, 7.55 + p.dd, 8.0 + p.dd * 0.4));
  x += dk * 2600 * p.side; y += dk * (p.ty - H / 2) * -0.4;
  return [x, y];
}
function scene4(t) {
  if (!PARTS) buildParticles();
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  // shockwave ring
  const sw = prog(t, 6.0, 6.6);
  if (sw > 0 && sw < 1) {
    ctx.strokeStyle = `rgba(241,237,228,${(1 - sw) * 0.7})`; ctx.lineWidth = 2 + 30 * (1 - sw);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, E.outExpo(sw) * 1300, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of PARTS) {
    const [x, y] = partPos(p, t), [px, py] = partPos(p, t - 0.022);
    ctx.strokeStyle = p.col; ctx.lineWidth = p.sz; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x + 0.01, y); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // flash
  const fl = Math.exp(-Math.max(0, t - 6) * 14);
  if (t >= 6) { ctx.fillStyle = `rgba(255,236,220,${fl * 0.85})`; ctx.fillRect(0, 0, W, H); }
}

/* =========================================================================
   SCENE 05 — 3D CAMERA / Z-SPACE TUNNEL (8 – 10s)
   ========================================================================= */
function scene5(t) {
  const lt = t - 8;
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100);
  g.addColorStop(0, '#1A2266'); g.addColorStop(1, C.deep);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const N = 30, gap = 220, f = 700, sides = 6, Rr = 620;
  const zoff = lt * 1500 + E.inExpo(prog(lt, 1.3, 2.0)) * 9000 + 1800 * E.outExpo(prog(lt, 0, 0.6));
  const roll = Math.sin(lt * 1.6) * 0.22 + lt * 0.25;
  const cx = W / 2 + Math.sin(lt * 1.3) * 90, cy = H / 2 + Math.cos(lt * 1.1) * 50;
  const rings = [];
  for (let k = 0; k < N; k++) {
    let z = ((k * gap - zoff) % (N * gap) + N * gap) % (N * gap) + 40;
    rings.push({ k, z });
  }
  rings.sort((a, b) => b.z - a.z);
  const proj = (z, i) => {
    const th = i / sides * TAU + z * 0.0016 + roll;
    const s = f / z;
    return [cx + Math.cos(th) * Rr * s * 1.25, cy + Math.sin(th) * Rr * s];
  };
  ctx.lineJoin = 'round';
  for (let n = 0; n < rings.length; n++) {
    const { z, k } = rings[n];
    const a = clamp(1 - z / (N * gap)) * clamp(z / 200);
    const accent = k % 5 === 0;
    ctx.strokeStyle = accent ? `rgba(255,68,34,${a})` : `rgba(241,237,228,${a * 0.8})`;
    ctx.lineWidth = Math.max(1, (accent ? 10 : 3) * f / z);
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) { const [x, y] = proj(z, i); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    // longitudinal struts to the next ring (depth cues)
    const nx = rings[n + 1];
    if (nx && Math.abs(nx.z - z - (-gap)) < 2) {
      ctx.strokeStyle = `rgba(120,140,255,${a * 0.5})`; ctx.lineWidth = Math.max(1, 1.5 * f / z);
      ctx.beginPath();
      for (let i = 0; i < sides; i++) { const [x1, y1] = proj(z, i), [x2, y2] = proj(nx.z, i); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
      ctx.stroke();
    }
  }
  // speed streaks
  const R = rng(3), sp = 0.4 + E.inExpo(prog(lt, 1.2, 2)) * 3;
  ctx.strokeStyle = 'rgba(241,237,228,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 90; i++) {
    const a = R() * TAU, ph = (R() + lt * sp) % 1, r0 = 80 + ph * ph * 1400;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r0 * (1 + 0.15 * sp), cy + Math.sin(a) * r0 * (1 + 0.15 * sp)); ctx.stroke();
  }
  // center type
  const tk = E.outExpo(prog(t, 8.15, 8.6)) * (1 - E.inExpo(prog(t, 9.3, 9.6)));
  if (tk > 0) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(0.6 + 0.4 * tk, 0.6 + 0.4 * tk); ctx.globalAlpha = tk;
    ctx.font = '700 120px Grotesk'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.bone;
    ctx.fillText('Z—SPACE', 0, 0);
    ctx.font = '500 22px Mono'; ctx.fillStyle = C.red; ctx.fillText('f = 700px   ·   v = 1500 u/s   ·   roll ±12°', 0, 90);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // exit flash
  const fl = E.inExpo(prog(t, 9.6, 10.0));
  if (fl > 0) { ctx.fillStyle = `rgba(241,237,228,${fl})`; ctx.fillRect(0, 0, W, H); }
}

/* =========================================================================
   SCENE 06 — ARABIC TYPOGRAPHY, RTL reveal + liquid fill (10 – 11.5s)
   ========================================================================= */
function scene6(t) {
  ctx.fillStyle = C.bone; ctx.fillRect(0, 0, W, H);
  const lt = t - 10;
  ctx.save();
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '900 400px Kufi';
  const word = 'حركة', bx = W / 2, by = 650;
  const m = ctx.measureText(word), tw = m.width, asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const L = bx - tw / 2, Rx = bx + tw / 2;
  // subtle drift (parallax) + scale push
  const push = 1 + lt * 0.035;
  ctx.translate(bx, by - asc / 2); ctx.scale(push, push); ctx.translate(-bx, -(by - asc / 2));
  // 1) outline revealed right-to-left (Arabic reading direction)
  const rv = E.outExpo(prog(t, 10.0, 10.5));
  ctx.save(); ctx.beginPath(); ctx.rect(Rx + 40 - (tw + 80) * rv, by - asc - 60, (tw + 80) * rv, asc + desc + 120); ctx.clip();
  ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.strokeText(word, bx, by);
  ctx.restore();
  // 2) liquid fill rising
  const lv = E.inOutCubic(prog(t, 10.3, 11.0));
  if (lv > 0) {
    const top = by + desc + 20, bottom = by - asc - 40, level = lerp(top, bottom, lv);
    ctx.save(); ctx.beginPath(); ctx.moveTo(L - 60, top + 200);
    for (let x = L - 60; x <= Rx + 60; x += 12) ctx.lineTo(x, level + Math.sin(x * 0.018 + lt * 9) * 16 * (1 - lv * 0.6) + Math.sin(x * 0.041 - lt * 6) * 8);
    ctx.lineTo(Rx + 60, top + 200); ctx.closePath(); ctx.clip();
    ctx.fillStyle = C.ink; ctx.fillText(word, bx, by);
    ctx.restore();
  }
  ctx.restore();
  // 3) the hero dot returns as a nuqta-like accent (marks the ة dots)
  const dk = spring(t - 10.85, 2.4, 7);
  if (t > 10.85) { ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(L - 80, by - 38, 38 * clamp(dk, 0, 1.3), 0, TAU); ctx.fill(); }
  // 4) bilingual caption, balanced: English left, Arabic right
  const ck = E.outExpo(prog(t, 10.55, 11.0));
  ctx.globalAlpha = ck; ctx.fillStyle = C.ink;
  ctx.font = '500 26px Mono'; ctx.textAlign = 'left'; ctx.direction = 'ltr';
  ctx.fillText('MOTION  /  ḤARAKA', 160, 930 + (1 - ck) * 30);
  ctx.font = '500 30px Kufi'; ctx.textAlign = 'right'; ctx.direction = 'rtl';
  ctx.fillText('تصميم الحركة — من اليمين إلى اليسار', W - 160, 935 + (1 - ck) * 30);
  ctx.fillRect(160, 880, (W - 320) * E.outExpo(prog(t, 10.45, 11.1)), 3);
  ctx.globalAlpha = 1; ctx.direction = 'ltr';
}

/* =========================================================================
   SCENE 07 — RAPID CUTS (11.5 – 13s), one cut every 1/4 beat-pair (0.25s)
   ========================================================================= */
function scene7(t) {
  const c = Math.floor((t - 11.5) / 0.25), lt = (t - 11.5) - c * 0.25;
  if (c === 0) { // data viz bars
    ctx.fillStyle = C.blue; ctx.fillRect(0, 0, W, H);
    const vals = [.35, .6, .45, .8, .55, .95, .7, .5, .85, .65, 1, .75];
    vals.forEach((v, i) => {
      const k = E.outBack(prog(lt, i * 0.012, i * 0.012 + 0.2));
      const bw = 100, x = 240 + i * 125, hh = v * 620 * k;
      ctx.fillStyle = i === 10 ? C.lime : C.bone; ctx.fillRect(x, 880 - hh, bw, hh);
    });
    ctx.fillStyle = C.bone; ctx.fillRect(200, 880, 1520, 4);
    ctx.font = '500 24px Mono'; ctx.fillText('DATA → STORY', 240, 160);
  } else if (c === 1) { // counter
    ctx.fillStyle = C.lime; ctx.fillRect(0, 0, W, H);
    const n = Math.round(E.outExpo(prog(lt, 0, 0.2)) * 100);
    ctx.fillStyle = C.ink; ctx.font = '700 520px Grotesk'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n + '%', W / 2, H / 2 + 30); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  } else if (c === 2) { // glitch
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
    const R = rng(Math.floor(t * 30) + 11);
    ctx.font = '700 480px Grotesk'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ff2a1a'; ctx.fillText('REEL', W / 2 - 14, H / 2 + 20);
    ctx.fillStyle = '#1a3cff'; ctx.fillText('REEL', W / 2 + 14, H / 2 + 20);
    ctx.fillStyle = '#20ff70'; ctx.globalAlpha = .6; ctx.fillText('REEL', W / 2, H / 2 + 20); ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 14; i++) { const y = R() * H, h = 8 + R() * 60, dx = (R() - .5) * 220; ctx.drawImage(buf, 0, y, W, h, dx, y, W, h); }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  } else if (c === 3) { // ripples
    ctx.fillStyle = C.red; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.ink;
    for (let i = 0; i < 9; i++) { const r = ((lt * 4 + i / 9) % 1); ctx.lineWidth = 3 + 26 * (1 - r); ctx.beginPath(); ctx.arc(W / 2, H / 2, E.outCubic(r) * 1100, 0, TAU); ctx.stroke(); }
  } else if (c === 4) { // flip tiles
    ctx.fillStyle = C.bone; ctx.fillRect(0, 0, W, H);
    const s = 120; ctx.fillStyle = C.ink;
    for (let j = 0; j < 9; j++) for (let i = 0; i < 16; i++) {
      const k = E.inOutCubic(prog(lt, (i + j) * 0.007, (i + j) * 0.007 + 0.09));
      const flip = Math.cos(k * Math.PI), on = ((i + j) % 2 === 0) !== (k > .5);
      if (!on) continue;
      ctx.fillRect(i * s, j * s + s / 2 - Math.abs(flip) * s / 2, s, Math.abs(flip) * s);
    }
  } else { // oscilloscope
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
    const cols = [C.red, C.bone, C.blue, C.lime];
    cols.forEach((col, n) => {
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const a = (80 + lt * 1600) * Math.sin(x / W * Math.PI);
        const y = H / 2 + a * Math.sin(x * 0.012 * (1 + n * 0.3) + t * 30 + n) ;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      } ctx.stroke();
    });
  }
  // cut marker
  ctx.font = '500 22px Mono'; ctx.fillStyle = c === 1 || c === 4 ? C.ink : C.bone;
  ctx.fillText(`CUT ${String(c + 1).padStart(2, '0')}/06`, W - 290, H - 150);
}

/* =========================================================================
   SCENE 08 — END CARD (13 – 15s)
   ========================================================================= */
function scene8(t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const lineY = 600;
  const lk = E.outExpo(prog(t, 13.0, 13.5));
  ctx.fillStyle = 'rgba(241,237,228,.9)';
  ctx.fillRect(W / 2 - 760 * lk, lineY, 1520 * lk, 3);
  // name rises from behind the line
  ctx.font = '700 250px Grotesk'; ctx.textBaseline = 'alphabetic';
  const name = 'CLAUDE', ws = [...name].map(ch => ctx.measureText(ch).width), tr = 4;
  const total = ws.reduce((a, b) => a + b + tr, -tr) + 70;
  let x = W / 2 - total / 2;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, lineY - 18); ctx.clip();
  for (let i = 0; i < name.length; i++) {
    const k = E.outExpo(prog(t, 13.08 + i * 0.045, 13.6 + i * 0.045));
    ctx.fillStyle = C.bone; ctx.fillText(name[i], x, lineY - 40 + (1 - k) * 260);
    x += ws[i] + tr;
  }
  ctx.restore();
  // hero dot returns as the full stop — bookends the reel
  const dx = x + 30, rest = lineY - 40 - 22;
  if (t > 13.3) {
    const u = t - 13.3; let y, sx = 1, sy = 1;
    if (u < 0.2) { const k = u / 0.2; y = lerp(-60, rest, k * k); sy = 1 + .3 * k; sx = 1 - .15 * k; }
    else if (u < 0.45) { const k = (u - 0.2) / 0.25; y = rest - 120 * 4 * k * (1 - k); }
    else if (u < 0.6) { const k = (u - 0.45) / 0.15; y = rest - 30 * 4 * k * (1 - k); }
    else y = rest;
    for (const tc of [0.2, 0.45, 0.6]) { const s = Math.exp(-Math.pow((u - tc) / 0.035, 2)); sx += .6 * s; sy -= .4 * s; }
    ctx.fillStyle = C.red; ctx.save(); ctx.translate(dx, y + 22); ctx.scale(sx, sy);
    ctx.beginPath(); ctx.arc(0, -22, 22, 0, TAU); ctx.fill(); ctx.restore();
  }
  // bilingual subtitle row
  const sk = E.outExpo(prog(t, 13.45, 13.95));
  ctx.globalAlpha = sk; ctx.fillStyle = C.bone;
  ctx.font = '500 26px Mono'; ctx.textAlign = 'left';
  ctx.fillText('MOTION DESIGN — SHOWREEL 2026', W / 2 - 760, lineY + 70 + (1 - sk) * 20);
  ctx.font = '500 32px Kufi'; ctx.textAlign = 'right'; ctx.direction = 'rtl';
  ctx.fillText('مصمم موشن جرافيك', W / 2 + 760, lineY + 74 + (1 - sk) * 20);
  ctx.direction = 'ltr'; ctx.textAlign = 'left';
  const ck = E.outExpo(prog(t, 13.7, 14.2));
  ctx.globalAlpha = ck * 0.55; ctx.font = '500 20px Mono';
  ctx.fillText('TYPE · 2D/3D · PARTICLES · ARABIC · SOUND-SYNCED', W / 2 - 760, lineY + 130);
  ctx.textAlign = 'right'; ctx.fillText('15s · 120 BPM · 450 FRAMES', W / 2 + 760, lineY + 130); ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

/* =========================================================================
   COMPOSITOR
   ========================================================================= */
const SCENES = [[0, 2, scene1, '01', 'SQUASH & STRETCH'], [2, 4, scene2, '02', 'KINETIC TYPE'], [4, 6, scene3, '03', 'STAGGER & MORPH'],
  [6, 8, scene4, '04', 'PARTICLE SYSTEMS'], [8, 10, scene5, '05', '3D CAMERA'], [10, 11.5, scene6, '06', 'ARABIC TYPOGRAPHY'],
  [11.5, 13, scene7, '07', 'RAPID CUTS'], [13, 15.01, scene8, '08', 'END CARD']];
const sceneAt = t => SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];

function drawScene(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.textAlign = 'left'; ctx.direction = 'ltr';
  // camera shake from impacts
  const e = hitEnergy(t, 10);
  const sh = Math.min(e, 1.6) * 14;
  ctx.translate(W / 2 + Math.sin(t * 91) * sh, H / 2 + Math.cos(t * 77) * sh);
  ctx.rotate(Math.sin(t * 53) * sh * 0.0012);
  ctx.translate(-W / 2, -H / 2);
  const s = sceneAt(t);
  ctx.save(); s[2](t); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* grain plates */
const GRAIN = [];
(function () {
  const R = rng(99);
  for (let g = 0; g < 6; g++) {
    const c = document.createElement('canvas'); c.width = 960; c.height = 540; const x = c.getContext('2d');
    const id = x.createImageData(960, 540);
    for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    x.putImageData(id, 0, 0); GRAIN.push(c);
  }
})();

function postFX(t) {
  // chromatic aberration on impacts
  const e = Math.min(hitEnergy(t, 14), 1.5);
  if (e > 0.08) {
    const off = Math.round(e * 9);
    const src = octx.getImageData(0, 0, W, H), d = src.data, o = new Uint8ClampedArray(d);
    for (let y = 0; y < H; y++) {
      const row = y * W * 4;
      for (let x = 0; x < W; x++) {
        const i = row + x * 4;
        const xr = Math.min(W - 1, x + off), xb = Math.max(0, x - off);
        o[i] = d[row + xr * 4]; o[i + 2] = d[row + xb * 4 + 2];
      }
    }
    octx.putImageData(new ImageData(o, W, H), 0, 0);
  }
  // vignette
  const v = octx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  octx.fillStyle = v; octx.fillRect(0, 0, W, H);
  // film grain
  octx.globalCompositeOperation = 'overlay';
  octx.drawImage(GRAIN[Math.floor(t * FPS) % GRAIN.length], 0, 0, W, H);
  octx.globalCompositeOperation = 'source-over';
}

function hud(t) {
  const s = sceneAt(t);
  const hk = 1 - prog(t, 12.95, 13.05);
  const fadeIn = prog(t, 0.1, 0.4);
  const a = Math.min(hk + (t > 13 ? 0 : 0), fadeIn);
  if (a <= 0) return;
  octx.save(); octx.globalCompositeOperation = 'difference'; octx.globalAlpha = a * 0.85;
  octx.fillStyle = '#fff'; octx.strokeStyle = '#fff'; octx.lineWidth = 2;
  // crop marks
  const m = 56, L = 28;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    octx.beginPath(); octx.moveTo(x, y + sy * L); octx.lineTo(x, y); octx.lineTo(x + sx * L, y); octx.stroke();
  });
  octx.font = '500 20px Mono'; octx.textBaseline = 'middle';
  const f = Math.floor(t * FPS + 1e-6), ss = Math.floor(f / FPS), ff = f % FPS;
  octx.textAlign = 'left'; octx.fillText(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, m + 44, m + 14);
  octx.textAlign = 'right'; octx.fillText('MOTION REEL ’26', W - m - 44, m + 14);
  octx.textAlign = 'left';
  // scene label with micro-wipe on change
  const lk = E.outExpo(prog(t, s[0], s[0] + 0.35));
  octx.save(); octx.beginPath(); octx.rect(m + 44, H - m - 40, 600 * lk, 50); octx.clip();
  octx.fillText(`${s[3]} — ${s[4]}`, m + 44, H - m - 14); octx.restore();
  // progress bar
  octx.fillRect(W - m - 344, H - m - 15, 300 * (t / DUR), 2);
  octx.globalAlpha = a * 0.3; octx.fillRect(W - m - 344, H - m - 15, 300, 2);
  octx.restore();
}

/* frame = average of sub-frames (180° shutter motion blur) */
const SUB = 5, SHUTTER = 0.5;
function renderFrame(t, sub = SUB) {
  octx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < sub; i++) {
    const ts = t + (sub > 1 ? (i / (sub - 1) - 0.5) * SHUTTER / FPS : 0);
    drawScene(Math.max(0, Math.min(DUR - 1e-4, ts)));
    octx.globalAlpha = 1 / (i + 1); octx.drawImage(buf, 0, 0);
  }
  octx.globalAlpha = 1;
  postFX(t); hud(t);
  // final fade
  const fo = prog(t, 14.55, 14.97);
  if (fo > 0) { octx.fillStyle = `rgba(0,0,0,${E.inCubic(fo)})`; octx.fillRect(0, 0, W, H); }
  return out;
}
window.renderFrame = renderFrame;

window.ready = (async () => {
  await Promise.all(['700 100px Grotesk', '500 20px Mono', '900 100px Kufi', '500 30px Kufi'].map(f => document.fonts.load(f, 'Aحركة')));
  await document.fonts.ready;
  layoutType(); buildParticles();
  if (!RENDER) {
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; renderFrame(t, 1); requestAnimationFrame(loop); };
    loop();
  }
  return true;
})();
</script>
</body>
