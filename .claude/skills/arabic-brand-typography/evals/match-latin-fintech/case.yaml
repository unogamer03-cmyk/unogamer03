schema_version: "1.1"
name: match-latin-fintech
expected_outcome: |
  Recommends 2–3 real Arabic typefaces suited to a neo-grotesque (with license notes and a caution to verify), explains pairing by construction/contrast/terminals rather than name, gives a stated Arabic:Latin size ratio, weight mapping by stem thickness, Arabic line-height around 1.6–1.9, a no-tracking rule for Arabic, numerals decision, and CSS using :lang(ar), dir=rtl, @font-face with size-adjust/unicode-range and letter-spacing 0.
