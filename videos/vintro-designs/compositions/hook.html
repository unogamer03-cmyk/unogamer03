  <script>
    const tl = gsap.timeline({ paused: true });
    const words = ["#hook-w1", "#hook-w2", "#hook-w3", "#hook-w4", "#hook-w6"];

    tl.fromTo("#hook-bar", { scaleY: 0.82 }, { scaleY: 1, duration: 0.7, ease: "expo.out" }, 0);
