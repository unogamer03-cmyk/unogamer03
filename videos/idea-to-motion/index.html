<!doctype html>
<html
  lang="ar"
  data-composition-variables='[
    {"id":"paper","type":"color","label":"Paper","default":"#EDE6D8"},
    {"id":"ink","type":"color","label":"Ink","default":"#141412"},
    {"id":"accent","type":"color","label":"Accent","default":"#E39B2F"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #ede6d8;
        --ink: #141412;
        --accent: #e39b2f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.2"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="idea"
        data-composition-id="idea"
        data-composition-src="compositions/idea.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="motion"
        data-composition-id="motion"
        data-composition-src="compositions/motion.html"
        data-start="4.2"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
